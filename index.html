<title>Still</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#EEEDE7; --text:#1D211F; --muted:#6B716D; --faint:#9CA29D;
  --line:#E1E2DC; --accent:#3D6A62; --accent-soft:rgba(61,106,98,.12); --accent-ink:#FFFFFF; --warn:#B0812A; --warn-soft:rgba(176,129,42,.12);
  --ink:#0E1110; --ink-2:#161A18; --ink-text:#E8EBE7; --ink-muted:#8F978F; --dot:#5FA294;
  --radius:14px; --radius-s:8px; --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101312; --surface:#171B19; --surface2:#1F2422; --text:#ECEEEA; --muted:#9BA29D; --faint:#6E756F;
  --line:#2A302D; --accent:#7FB3A7; --accent-soft:rgba(127,179,167,.16); --accent-ink:#0E1110; --warn:#D2A24E; --warn-soft:rgba(210,162,78,.16);
}}
:root[data-theme="dark"]{
  --bg:#101312; --surface:#171B19; --surface2:#1F2422; --text:#ECEEEA; --muted:#9BA29D; --faint:#6E756F;
  --line:#2A302D; --accent:#7FB3A7; --accent-soft:rgba(127,179,167,.16); --accent-ink:#0E1110; --warn:#D2A24E; --warn-soft:rgba(210,162,78,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 48px;min-height:100%}
.topbar{display:flex;align-items:center;gap:8px;min-height:52px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.topbar .grow{flex:1;min-width:0}
.topbar h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.topbar h1.brand{font-size:30px;font-weight:300}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.iconbtn:hover{background:var(--accent-soft)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
.start-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:28px 12px;text-align:center}
.start{width:168px;height:168px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.start:active{transform:scale(.97)}
.start .inner{width:148px;height:148px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.start .inner .icon{width:38px;height:38px;stroke-width:1.4}
.start-label{font-weight:600;font-size:17px}
.hint{color:var(--muted);font-size:14px;max-width:320px;text-wrap:balance}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.accent{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface2);font-size:13px;color:var(--muted);border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.small{padding:2px 8px;font-size:12px}
.section-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-family:var(--display);font-weight:500;font-size:21px}
.section-h .count{font-family:var(--font);font-size:14px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:14px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line);color:var(--text)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .ic{color:var(--accent);margin-top:2px}
.row .ic.warn{color:var(--warn)}
.row .body{flex:1;min-width:0}
.row .t{font-size:16px}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .chev{color:var(--faint);margin-top:4px}
.row .cnt{color:var(--muted);font-size:14px;margin-top:3px}
.row.quote .t{font-family:var(--display);font-size:17px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .icon{width:34px;height:34px;margin-bottom:10px;color:var(--faint)}
.empty h3{margin:0 0 6px;font-weight:600;color:var(--text);font-size:16px}
.empty p{margin:0;font-size:14px;max-width:340px;margin-inline:auto}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}

@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:500;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:#B0432A}
.btn.small{padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:13px;color:var(--muted)}
.field input[type=text],.field select,.field textarea,.search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.field textarea{min-height:90px;resize:vertical}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.field.inline select{width:auto;max-width:60%}
.field .help{font-size:13px;color:var(--muted)}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}
.kv{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.kv span{display:inline-flex;align-items:center;gap:5px}
.kv .icon{width:15px;height:15px}
.header-card{padding:14px}
.header-card .date{color:var(--muted);font-size:14px}
.header-card .summary{margin-top:8px;font-size:15px}
.big{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.3;text-wrap:balance}
.quote-text{font-family:var(--display);font-size:22px;font-style:italic;font-weight:300;line-height:1.35}
.original{font-size:15px;color:var(--muted);padding:12px 14px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 0 6px;font-weight:600}
.segment{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.segment:first-child{border-top:0}
.segment .time{width:60px;flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.segment .time button{color:var(--accent);display:inline-flex}
.segment .txt{flex:1;font-size:15px}
.segment .txt .tag{font-size:12px;color:var(--faint);margin-top:4px}
.gap{padding:8px 14px;text-align:center;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.review{padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:var(--ink);color:var(--ink-text);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.overlay .top{font-size:15px;color:var(--ink-muted)}
.overlay .mid{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:340px}
.timer{font-family:var(--display);font-weight:300;font-size:64px;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.state{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--ink-muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot);opacity:.45;transition:opacity .35s}
.dot.live{opacity:1}
.dot.warn{background:var(--warn)}
.captured{font-size:15px;color:var(--ink-muted)}
.last{font-size:14px;color:var(--ink-muted);opacity:.8;min-height:20px;max-width:320px;font-style:italic}
.overlay .hintdark{font-size:13px;color:var(--ink-muted);opacity:.75;max-width:280px}
.endbtn{width:118px;height:118px;border-radius:50%;background:var(--ink-2);color:var(--ink-text);border:1px solid #2A302D;font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:center}
.endbtn:active{transform:scale(.97)}
.overlay .bottom{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
.writebox{display:flex;gap:8px;width:100%}
.writebox input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #2A302D;background:var(--ink-2);color:var(--ink-text)}
.writebox button{padding:10px 14px;border-radius:10px;background:#2A302D;color:var(--ink-text)}
.overlay .saved{display:flex;flex-direction:column;gap:10px;align-items:center}
.overlay .saved .icon{width:44px;height:44px;color:var(--dot);stroke-width:1.2}
.overlay .saved h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0}
.overlay .saved p{margin:0;color:var(--ink-muted);font-size:15px}
.overlay .btn.primary{background:var(--dot);color:#0E1110;border-color:var(--dot)}
.overlay .btn.ghost{background:transparent;border-color:#2A302D;color:var(--ink-text)}
.overlay .darkmuted{color:var(--ink-muted)}
.segmented{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.segmented button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{margin-bottom:12px}
.example-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;margin-left:6px;vertical-align:middle}
.note{padding:12px 14px;font-size:14px;color:var(--muted)}
.note strong{color:var(--text)}
.prose p{margin:0 0 12px;max-width:62ch}
.prose h3{font-family:var(--display);font-weight:500;font-size:20px;margin:22px 0 8px}
.prose ul{padding-left:20px;margin:0 0 12px}
.prose li{margin-bottom:4px}
.proto-banner{margin-top:12px;padding:10px 14px;border-radius:var(--radius);background:var(--surface2);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.proto-banner .icon{width:18px;height:18px;margin-top:1px;color:var(--faint)}
.checkbox{width:24px;height:24px;border-radius:50%;border:1.7px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;color:var(--accent);flex:none;margin-top:1px}
.checkbox.on{background:var(--accent);color:var(--accent-ink)}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.inline-actions button{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.right{margin-left:auto}
@media (max-width:420px){.timer{font-size:56px}}

<div id="app" class="shell"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script>
// ===================== ENGINE: ported from StillCore (Swift) =====================
const ENGINE = (() => {
  const THOUGHT_TYPES = ['task','event','reminder','message','business_idea','project_idea','product_improvement','reflection','insight','question','research','decision','problem','observation','follow_up','shopping','possibility','uncategorized'];
  const CATEGORY_KEYS = ['tasks','calendar','people','business_ideas','project_ideas','product_improvements','work','decisions','questions','research','personal_ideas','life_philosophy','writing','shopping','uncategorized'];
  const TYPE_CATEGORY = {task:'tasks',reminder:'tasks',event:'calendar',message:'people',follow_up:'people',business_idea:'business_ideas',possibility:'business_ideas',project_idea:'project_ideas',product_improvement:'product_improvements',decision:'decisions',question:'questions',research:'research',insight:'life_philosophy',reflection:'life_philosophy',observation:'personal_ideas',problem:'work',shopping:'shopping',uncategorized:'uncategorized'};
  const ACTION_TYPES = new Set(['task','reminder','message','follow_up','shopping','event']);
  const IDEA_TYPES = new Set(['business_idea','project_idea','product_improvement','possibility','observation']);

  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  const normalize = t => fold(t).toLowerCase().replace(/’/g,"'").replace(/[^a-z0-9' ]+/g,' ').trim().replace(/\s+/g,' ');
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hasWord = (t,w) => new RegExp('\\b'+esc(w)+'\\b').test(t);
  const anyWord = (t,list) => list.filter(w => hasWord(t,w));
  const uid = () => 't-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);

  // ---------- Modality ----------
  const POSSIBILITY = ['maybe','might','perhaps','could','sometime','at some point','what if','we could','i could','possibly','eventually','someday','quizas','quiza','tal vez','podria','podriamos','a lo mejor','en algun momento','y si','algun dia','capaz'];
  const COMMITMENT = ['i need to','i need','we need to','i want to','need to','i have to','have to','i must','i gotta','got to','remind me',"don't forget",'dont forget','i will',"i'll","i'm going to",'im going to','make sure','i should','tengo que','necesito','debo','acuerdame','recuerdame','hay que','voy a','no olvidar','que no se me olvide','deberia'];
  const IMPERATIVE = ['buy','call','send','email','text','book','schedule','review','check','write','read','pay','order','look into','run the numbers','model','talk to','ask','follow up','set up','comprar','compra','llamar','llama','mandar','manda','enviar','agendar','revisar','escribir','pagar','pedir','hablar con','preguntar','investigar','averiguar'];
  const DECISION = ['we are not',"we're not",'we are launching',"we're launching",'we are going with',"we're going with","i've decided",'i decided','decided',"let's go with",'we will not',"we won't",'final answer','we are doing',"we're doing",'decidi','he decidido','no vamos a','vamos a lanzar','nos vamos con','queda decidido','lo vamos a hacer'];
  const OPINION = ['i think',"i don't think",'i dont think','i believe','i feel like','it seems','in my opinion','i guess','i keep thinking','creo que','no creo que','pienso que','me parece','siento que','supongo'];
  const QUESTION_STARTS = ['what','why','how','when','where','who','which','is','are','can','could','should','do','does','would','will','i wonder','que','por que','como','cuando','donde','quien','cual','me pregunto','sera que'];
  const DATE_HEDGE = /\b(maybe|perhaps|probably|quizas|quiza|tal vez|a lo mejor|posiblemente) (on |el |la |este |esta |next |la proxima |el proximo |proximo |proxima )?(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|tonight|today|next week|this week|this weekend|lunes|martes|miercoles|jueves|viernes|sabado|domingo|manana|hoy|semana|fin de semana|\d{1,2})\b/g;

  function assessModality(text){
    const t = normalize(text);
    let possibility = anyWord(t, POSSIBILITY);
    if (DATE_HEDGE.test(t)) { DATE_HEDGE.lastIndex = 0; const without = t.replace(DATE_HEDGE,' '); possibility = anyWord(without, POSSIBILITY); }
    DATE_HEDGE.lastIndex = 0;
    const commitment = anyWord(t, COMMITMENT), decision = anyWord(t, DECISION), opinion = anyWord(t, OPINION);
    const endsQ = /\?\s*$/.test(text.trim());
    const startsQ = QUESTION_STARTS.some(q => t.startsWith(q+' '));
    const wonder = t.includes('i wonder') || t.includes('me pregunto');
    const imperative = IMPERATIVE.some(v => t.startsWith(v+' ') || t.startsWith('also '+v+' ') || t.startsWith('y '+v+' ') || t.startsWith('tambien '+v+' '));
    const strong = ['maybe','might','sometime','what if','y si','quizas','tal vez','a lo mejor','en algun momento','perhaps'];
    if (possibility.length && (commitment.length === 0 || possibility.some(p => strong.includes(p)))) {
      const whatIf = possibility.includes('what if') || possibility.includes('y si');
      return {modality:'possibility', confidence: whatIf ? 0.85 : 0.75};
    }
    if (wonder || (endsQ && commitment.length === 0) || (startsQ && commitment.length === 0 && !imperative && endsQ)) return {modality:'question', confidence: (wonder||endsQ) ? 0.85 : 0.6};
    if (commitment.length || imperative) { const soft = commitment.length && commitment.every(c => ['i should','deberia'].includes(c)) && !imperative; return {modality:'commitment', confidence: soft ? 0.6 : 0.85}; }
    if (decision.length) return {modality:'decision', confidence:0.8};
    if (startsQ && !endsQ && t.split(' ').length <= 12) return {modality:'question', confidence:0.5};
    if (opinion.length) return {modality:'opinion', confidence:0.75};
    return {modality:'statement', confidence:0.5};
  }

  // ---------- Text cleanup ----------
  const LEADING = ['okay random but','okay so','ok so','okay','ok','so','um','uh','hmm','well','also','and also','oh','bueno','pues','este','o sea','a ver','eh','mmm','también','y también','y','e'];
  const INLINE = ['um','uh','hmm','you know','i mean','kind of like','sort of like','like i said','basically','literally','este','o sea','eh','mmm','digamos','tipo'];
  function clean(text){
    let t = text.trim(); if (!t) return t;
    let changed = true;
    while (changed) { changed = false; for (const f of LEADING) { const re = new RegExp('^'+esc(f)+'[,\\s]+','i'); if (re.test(t)) { t = t.replace(re,''); changed = true; } } }
    for (const f of INLINE) t = t.replace(new RegExp('(?<=\\s|^)'+esc(f)+',?(?=\\s)','gi'),'');
    t = t.replace(/(^|(?<=[.!?])\s+)(i don'?t know|no s[eé]|anyway|we'?ll see|ya veremos|en fin)[.!]?(?=\s|$)/gi,' ');
    t = t.replace(/\b(\w+)( \1\b)+/gi,'$1').replace(/\s+/g,' ').replace(/ ,/g,',').replace(/,,/g,',').replace(/^[,\s]+|[,\s]+$/g,'');
    if (!t) return text;
    t = t[0].toUpperCase()+t.slice(1);
    if (!/[.?!…]$/.test(t)) t += '.';
    return t;
  }
  const ACTION_PREFIXES = ['i need to ','i have to ','need to ','i must ','i should ','i gotta ',"i've got to ",'i will ',"i'll ","i'm going to ",'remind me to ',"don't forget to ",'make sure to ','also ','tengo que ','necesito ','debo ','hay que ','voy a ','acuérdame de ','recuérdame ','que no se me olvide '];
  function actionTitle(text){
    let t = clean(text); let changed = true;
    while (changed) { changed = false; for (const p of ACTION_PREFIXES) { if (t.toLowerCase().startsWith(p)) { t = t.slice(p.length); changed = true; } } }
    t = t.replace(/^[.!, ]+|[.!, ]+$/g,''); if (!t) return clean(text);
    return t[0].toUpperCase()+t.slice(1);
  }

  // ---------- Splitting ----------
  const SPLITTERS = [', and also ',' and also ',', also ','; also ',', and i ',' and i also ',', and we ',', and then ',', plus ','. also ',', another thing ',', oh and ',', y también ',' y también ',', también ',', además ',', y tengo que ',', y necesito ',', y hay que ',', otra cosa ',', ah y '];
  const CONTINUATION = ['maybe ','perhaps ','so ',"that's why ",'thats why ','which means ','which is why ','that means ','and that ','because of that ','quizas ','tal vez ','entonces ','por eso ','o sea ','es decir '];
  const HEDGES = ["i don't know",'i dont know','no se','anyway','whatever',"we'll see",'well see','ya veremos','en fin','bueno','i guess','or not','or something'];
  const isContinuation = s => { const t = normalize(s)+' '; return CONTINUATION.some(c => t.startsWith(c)); };
  const isHedge = p => { const t = normalize(p); return HEDGES.includes(t) || HEDGES.includes(t.replace(/'/g,'')); };
  function splitClauses(sentence){
    let parts = [sentence];
    for (const sp of SPLITTERS) {

  }
  function viewSearch(){
    const q = E.normalize(state.search.replace(/^(what did i say about|things i said about|ideas about|thoughts about|que dije sobre|qué dije sobre|ideas sobre|pensamientos sobre|lo que dije de)\s+/i,''));
    const words = q.split(' ').filter(Boolean);
    const hits = words.length ? allThoughts().filter(x => !x.archived && words.every(w => E.normalize(x.originalText+' '+x.cleanText).includes(w))) : [];
    const sess = words.length ? state.sessions.filter(s => words.every(w => E.normalize((s.title||'')+' '+(s.summary||'')).includes(w))) : [];
    const ppl = words.length ? state.people.filter(p => words.every(w => E.normalize(p.name).includes(w))) : [];
    return topbar(t('search')) + `<div class="search"><input type="search" id="search-input" placeholder="${esc(t('searchPh'))}" value="${esc(state.search)}" data-keep="search-input" autocomplete="off"></div>` +
      (!state.search ? `<div class="label">${esc(t('tryQ'))}</div><div class="card">${t('examples').map(x => `<button class="row" data-act="search-set" data-q="${esc(x)}"><span class="body"><span class="t" style="color:var(--muted)">${esc(x)}</span></span></button>`).join('')}</div>` :
      (hits.length||sess.length||ppl.length ? (hits.length?`<div class="section-h">${t('ideas')==='Ideas'&&lang()==='en'?'Thoughts':'Pensamientos'}</div><div class="card">${hits.map(th => thoughtRow(th)).join('')}</div>`:'') + (sess.length?`<div class="section-h">${lang()==='es'?'Sesiones':'Sessions'}</div><div class="card">${sess.map(s => sessionRow(s,true)).join('')}</div>`:'') + (ppl.length?`<div class="section-h">${t('people')}</div><div class="card">${ppl.map(p => `<button class="row" data-act="nav" data-to="person/${p.id}"><span class="ic">${icon('person')}</span><span class="body"><span class="t">${esc(p.name)}</span></span></button>`).join('')}</div>`:'') : `<div class="card">${empty('search', t('nothingFound'), t('tryOther'))}</div>`));
  }
  function viewTimeline(){
    const ranges = {today: startOfDay(Date.now()).getTime(), week: Date.now()-7*86400000, month: Date.now()-31*86400000, year: Date.now()-365*86400000, all: 0};
    const items = state.sessions.filter(s => s.startedAt >= ranges[state.range]); const days = {}; for (const s of items) (days[startOfDay(s.startedAt).getTime()] = days[startOfDay(s.startedAt).getTime()] || []).push(s);
    return topbar(t('timeline')) + `<div class="segmented">${['today','week','month','year','all'].map(r => `<button class="${state.range===r?'on':''}" data-act="range" data-r="${r}">${esc(t(r))}</button>`).join('')}</div>` + (items.length ? Object.keys(days).sort((a,b)=>b-a).map(d => `<div class="section-h">${esc(fmtDay(+d))}</div><div class="card">${days[d].map(s => sessionRow(s,false)).join('')}</div>`).join('') : `<div class="card">${empty('clock', t('nothingRange'), t('timelineHint'))}</div>`);
  }
  function viewSettings(){
    const S = state.settings; const langs = ['en-US','en-GB','es-MX','es-ES','es-AR','es-CO'];
    return topbar(t('settings')) + `<div class="card"><div class="field inline"><label for="set-ui">${esc(t('uiLang'))}</label><select id="set-ui" data-set="uiLang"><option value="es" ${S.uiLang==='es'?'selected':''}>Español</option><option value="en" ${S.uiLang==='en'?'selected':''}>English</option></select></div><div class="field inline"><label for="set-spoken">${esc(t('spokenLang'))}</label><select id="set-spoken" data-set="spokenLang">${langs.map(l => `<option value="${l}" ${S.spokenLang===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="field inline"><label for="set-sens">${esc(t('sensitivity'))}</label><select id="set-sens" data-set="sensitivity"><option value="low" ${S.sensitivity==='low'?'selected':''}>${esc(t('low'))}</option><option value="normal" ${S.sensitivity==='normal'?'selected':''}>${esc(t('normal'))}</option><option value="high" ${S.sensitivity==='high'?'selected':''}>${esc(t('high'))}</option></select></div></div>` +
      `<div class="label">${esc(t('endPhrases'))}</div><div class="card">${S.endPhrases.map((p,i) => `<div class="field inline"><span>${esc(p)}</span><button class="iconbtn" data-act="phrase-del" data-i="${i}" aria-label="${esc(t('del'))}">${icon('x')}</button></div>`).join('')}<div class="field"><div class="writebox" style="gap:8px"><input type="text" id="phrase-new" placeholder="${esc(t('addPhrase'))}" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button class="btn" data-act="phrase-add">${esc(t('add'))}</button></div><span class="help">${esc(t('endPhrasesHelp'))}</span></div></div>` +
      `<div class="label">${esc(t('ai'))}</div><div class="card"><div class="field inline"><label for="set-ai">${esc(t('ai'))}</label><button id="set-ai" class="toggle ${S.ai?'on':''}" role="switch" aria-checked="${S.ai}" data-act="toggle-ai"></button></div><div class="field"><span class="help">${esc(sampleFn ? t('aiHelp') : t('aiUnavailable'))}</span></div></div>` +
      `<div class="card" style="margin-top:22px">${dest(t('context'),'brain','context')}${dest(t('about'),'moon','about')}</div>` +
      `<div class="card" style="margin-top:22px"><button class="row" data-act="delete-all"><span class="ic" style="color:#B0432A">${icon('trash')}</span><span class="body"><span class="t" style="color:#B0432A">${esc(t('deleteAll'))}</span></span></button></div>`;
  }
  function viewContext(){
    return topbar(t('context')) + `<div class="note">${esc(t('contextHint'))}</div>` +
      `<div class="label">${esc(t('projects'))}</div><div class="card">${state.projects.length ? state.projects.map(p => `<button class="row" data-act="nav" data-to="project/${p.id}"><span class="ic">${icon('folder')}</span><span class="body"><span class="t">${esc(p.name)}</span>${p.summary?`<span class="s">${esc(p.summary)}</span>`:''}</span></button>`).join('') : `<div class="note">…</div>`}</div>` +
      `<div class="label">${esc(t('people'))}</div><div class="card">${state.people.length ? state.people.map(p => `<button class="row" data-act="nav" data-to="person/${p.id}"><span class="ic">${icon('person')}</span><span class="body"><span class="t">${esc(p.name)}</span></span><span class="cnt">${esc(p.mentions===1?t('oneMention'):t('mentions',p.mentions))}</span></button>`).join('') : `<div class="note">…</div>`}</div>` +
      `<div class="label">${esc(t('vocabulary'))}</div><div class="card">${state.vocabulary.map((w,i) => `<div class="field inline"><span>${esc(w)}</span><button class="iconbtn" data-act="word-del" data-i="${i}" aria-label="${esc(t('del'))}">${icon('x')}</button></div>`).join('')}<div class="field"><div class="writebox"><input type="text" id="word-new" placeholder="${esc(t('addWord'))}" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button class="btn" data-act="word-add">${esc(t('add'))}</button></div><span class="help">${esc(t('vocabHint'))}</span></div></div>`;
  }
  function viewAbout(){ return topbar(t('about')) + `<div class="prose" style="padding-top:8px"><h3 style="margin-top:8px">${esc(t('whyTitle'))}</h3><p>${esc(t('why1'))}</p><p><em>${esc(t('why2'))}</em></p><h3>${esc(t('neverTitle'))}</h3><ul>${t('never').map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`; }

  function render(){
    const {p, id} = route(); let html;
    switch (p) { case 'session': html = viewSession(id); break; case 'thought': html = viewThought(id); break; case 'transcript': html = viewTranscript(id); break; case 'inbox': html = viewInbox(); break; case 'list': html = viewList(id); break; case 'projects': html = viewProjects(); break; case 'project': html = viewProject(id); break; case 'people': html = viewPeople(); break; case 'person': html = viewPerson(id); break; case 'search': html = viewSearch(); break; case 'timeline': html = viewTimeline(); break; case 'settings': html = viewSettings(); break; case 'context': html = viewContext(); break; case 'about': html = viewAbout(); break; default: html = viewHome(); }
    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.keep : null; const pos = focused ? document.activeElement.selectionStart : null;
    document.getElementById('app').innerHTML = html;
    if (focused) { const el = document.querySelector(`[data-keep="${focused}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
  }

  // ---------- Overlay (active session) ----------
  function showOverlay(){ const o = document.getElementById('overlay'); o.hidden = false; renderOverlay(); }
  function hideOverlay(){ document.getElementById('overlay').hidden = true; state.active = null; }
  function renderOverlay(){
    const s = state.active; const o = document.getElementById('overlay'); if (!s || o.hidden) return;
    const count = s.segments.filter(g => g.text || AUDIO[g.id] || s.openSeg === g).length;
    if (s.status === 'ended') {
      const processing = s.processing !== 'organized';
      o.innerHTML = `<div class="top">${esc(s.title||'Still')}</div><div class="mid"><div class="saved">${icon('check')}<h2>${esc(t('savedTitle'))}</h2><p>${esc(fmtDur(s.durationS||0))} · ${esc(captured(s.segments.length))}</p><p>${processing ? (s.processing==='ai'?esc(t('organizingAI')):esc(t('organizing'))) : esc(t('organized'))}</p>${s.processing==='ai'?`<button class="linkbtn darkmuted" data-act="use-rules">${esc(t('useRules'))}</button>`:''}</div></div><div class="bottom"><button class="btn primary block" data-act="view-session" data-id="${s.id}">${esc(t('viewSession'))}</button><button class="btn ghost block" data-act="close-overlay">${esc(t('done'))}</button></div>`;
      return;
    }
    const stateText = s.ending ? t('ending') : s.openSeg ? t('capturing') : t('listening');
    const framed = (() => { try { return window.top !== window.self; } catch { return true; } })();
    const blocked = (!s.captureOk && s.micError === 'NotAllowedError') || (!s.recOk && s.recReason === 'not-allowed');
    let notes = [];
    if (blocked && framed) notes.push(t('framedMic'));
    else {
      if (!s.captureOk) notes.push(s.micError === 'NotAllowedError' ? t('micDenied') : t('noMic'));
      if (!s.recOk) notes.push(s.recReason === 'unsupported' ? t('noRec') : t('recDenied'));
    }
    const escape = blocked && framed ? `<a class="btn primary" style="text-decoration:none" href="${esc(location.href)}" target="_blank" rel="noopener">${esc(t('openFull'))}</a><div class="hintdark" style="user-select:all;-webkit-user-select:all;word-break:break-all">${esc(location.href)}</div>` : '';
    const top = s.confirmEnd
      ? (s.confirmDiscard ? `<div class="top" style="color:var(--warn)">${esc(t('discardQ'))} <button class="btn small ghost" style="margin-left:8px;color:#E08A6B;border-color:#3A2E2A" data-act="discard-now">${esc(t('discardYes'))}</button></div>`
                           : `<div class="top"><button class="linkbtn darkmuted" style="font-size:13px" data-act="discard">${esc(t('discard'))}</button></div>`)
      : `<div class="top">${esc(s.title || 'Still')}</div>`;
    o.innerHTML = `${top}<div class="mid"><div class="timer" id="timer">${clock((Date.now()-s.startedAt)/1000)}</div><div class="state"><span class="dot ${s.openSeg?'live':''}" id="dot"></span>${esc(stateText)}</div><div class="captured">${esc(captured(count))}</div><div class="last" id="last">${esc(s.interim || s.lastText || '')}</div>${notes.map(n => `<div class="hintdark" style="color:var(--warn)">${esc(n)}</div>`).join('')}${escape}${!notes.length && Date.now()-s.startedAt < 20000 ? `<div class="hintdark">${esc(t('hint'))}</div>`:''}</div><div class="bottom">${s.confirmEnd ? `<div class="state" style="gap:12px"><button class="btn primary" data-act="end-now">${esc(t('endSession'))}</button><button class="btn ghost" data-act="end-cancel">${esc(t('keep'))}</button></div>` : `<button class="endbtn" data-act="end" ${s.ending?'disabled':''}>${esc(t('end'))}</button>`}<form class="writebox" data-form="write" autocomplete="off"><input type="text" id="write" placeholder="${esc(t('writePh'))}" autocomplete="off" enterkeyhint="send"><button type="submit" data-act="write">${esc(t('add'))}</button></form></div>`;
  }

  // ---------- Export ----------
  function exportMarkdown(s){
    const th = (s.thoughts||[]).filter(x => !x.archived); const groups = {}; for (const x of th) (groups[x.category] = groups[x.category] || []).push(x);
    let md = `# ${s.title||t('session')}\n\n${fmtDay(s.startedAt)} · ${fmtTime(s.startedAt)}  \n${t('silence', fmtDur(Math.max(0,(s.durationS||0)-(s.speechS||0))))} · ${t('spoken', fmtDur(s.speechS||0))} · ${nThoughts(th.length)}\n\n`;
    if (s.summary) md += `> ${s.summary}\n\n`;
    for (const k of E.CATEGORY_KEYS.filter(k => groups[k])) { md += `## ${catName(k)}\n\n`; for (const x of groups[k]) { md += `- ${x.cleanText}${x.dueDate?` _(${fmtDue(x)}${x.dueAmbiguous?', '+t('toConfirm'):''})_`:''}\n`; if (x.cleanText !== x.originalText) md += `  - ${lang()==='es'?'Original':'Original'}: “${x.originalText}”\n`; } md += '\n'; }
    md += `## ${t('transcript')}\n\n`; let prev = s.startedAt;
    for (const g of [...s.segments].sort((a,b)=>a.startedAt-b.startedAt)) { if (g.startedAt - prev > 60000) md += `_${t('ofSilence', fmtDur((g.startedAt-prev)/1000))}_\n\n`; md += `**${fmtTime(g.startedAt)}** ${g.text||''}\n\n`; prev = g.endedAt||g.startedAt; }
    return md;
  }
  function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 1800); }
  async function copyText(text){ try { await navigator.clipboard.writeText(text); toast(t('copied')); } catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(t('copied')); } catch {} ta.remove(); } }

  // ---------- Audio playback ----------
  let player = null;
  function togglePlay(segId){
    if (player && state.ui.playing === segId) { player.pause(); player = null; state.ui.playing = null; render(); return; }
    if (player) { player.pause(); player = null; }
    const blob = AUDIO[segId]; if (!blob) return;
    player = new Audio(URL.createObjectURL(blob)); state.ui.playing = segId; player.onended = () => { state.ui.playing = null; player = null; render(); }; player.play().catch(() => {}); render();
  }

  // ---------- Events ----------
  function onClick(e){
    const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return; const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'nav': go(el.dataset.to); break;
      case 'back': history.length > 1 ? history.back() : go(''); break;
      case 'start': startSession(state.pendingActivity); break;
      case 'activity': state.pendingActivity = state.pendingActivity === el.dataset.a ? null : el.dataset.a; render(); break;
      case 'example': { const s = seedExample(); go('session/'+s.id); break; }
      case 'end': { const s = state.active; if (!s) break; if (Date.now() - s.startedAt < 15000) { endSession('user'); break; } s.confirmEnd = true; renderOverlay(); clearTimeout(state.ui.endTimer); state.ui.endTimer = setTimeout(() => { if (state.active && !state.active.confirmDiscard) { state.active.confirmEnd = false; renderOverlay(); } }, 6000); break; }
      case 'end-now': { const s = state.active; if (!s) break; s.confirmEnd = false; clearTimeout(state.ui.endTimer); endSession('user'); break; }
      case 'end-cancel': { const s = state.active; if (!s) break; s.confirmEnd = false; s.confirmDiscard = false; clearTimeout(state.ui.endTimer); renderOverlay(); break; }
      case 'discard': { const s = state.active; if (!s) break; s.confirmDiscard = true; renderOverlay(); clearTimeout(state.ui.endTimer); state.ui.endTimer = setTimeout(() => { if (state.active) { state.active.confirmEnd = false; state.active.confirmDiscard = false; renderOverlay(); } }, 6000); break; }
      case 'discard-now': { clearTimeout(state.ui.endTimer); discardSession(t('discarded')); break; }
      case 'write': { const inp = document.getElementById('write'); if (inp && inp.value.trim() && state.active) { const txt = inp.value.trim(); inp.value = ''; const m = E.detectEnd(txt, state.settings.endPhrases); if (m.matched) { if (m.remaining.trim()) typedThought(state.active, m.remaining); endSession('endPhrase'); } else typedThought(state.active, txt); } break; }
      case 'view-session': hideOverlay(); go('session/'+id); render(); break;
      case 'close-overlay': hideOverlay(); render(); break;
      case 'use-rules': if (aiAbort) aiAbort.abort(); break;
      case 'session-menu': state.ui.menuFor = state.ui.menuFor === id ? null : id; render(); break;
      case 'rename': { const s = state.sessions.find(x => x.id === id); const v = prompt(t('rename'), s.title||''); if (v !== null && v.trim()) { s.title = v.trim(); s.titleUser = true; save(); state.ui.menuFor = null; render(); } break; }
      case 'reorganize': { const s = state.sessions.find(x => x.id === id); state.ui.menuFor = null; if (s) organize(s); break; }
      case 'delete-session': if (confirm(t('deleteSessionQ'))) { state.sessions = state.sessions.filter(x => x.id !== id); save(); go(''); } break;
      case 'export': { const s = state.sessions.find(x => x.id === id); if (!s) break; const md = exportMarkdown(s); if (downloadsNs) downloadsNs.save({filename: (s.title||'still').replace(/[^\w\- áéíóúñ]/gi,'').trim()+'.md', data: md}).then(() => toast(t('exported'))).catch(err => { if (err && err.code !== 'declined') copyText(md); }); else copyText(md); break; }
      case 'copy': { const th = findThought(id); if (th) copyText(th.cleanText + (th.cleanText !== th.originalText ? `\n\n“${th.originalText}”` : '')); break; }
      case 'flag': { const th = findThought(id); if (!th) break; const f = el.dataset.f; if (f === 'reviewed') { th.reviewed = true; th.needsReview = false; } else if (f === 'done') { if (th.task) th.task.done = !th.task.done; } else if (f === 'archived') { th.archived = true; if (route().p === 'thought') go(''); } else th[f] = !th[f]; save(); render(); break; }
      case 'settype': { const th = findThought(id); if (!th) break; setType(th, el.dataset.ty); th.reviewed = true; th.needsReview = false; save(); render(); break; }
      case 'delete-thought': if (confirm(t('deleteThoughtQ'))) { for (const s of state.sessions) s.thoughts = (s.thoughts||[]).filter(x => x.id !== id); save(); go(''); } break;
      case 'play': togglePlay(id); break;
      case 'project-new': state.ui.newProject = true; render(); document.getElementById('np-name')?.focus(); break;
      case 'project-cancel': state.ui.newProject = false; render(); break;
      case 'project-save': { const name = (document.getElementById('np-name')||{}).value||''; if (!name.trim()) break; const p = {id: sid(), name: name.trim(), summary: ((document.getElementById('np-desc')||{}).value||'').trim()||null, aliases: ((document.getElementById('np-alias')||{}).value||'').split(',').map(x=>x.trim()).filter(Boolean)}; state.projects.push(p); linkProject(p); state.ui.newProject = false; save(); render(); break; }
      case 'project-adopt': { const p = {id: sid(), name: el.dataset.name, summary:null, aliases:[]}; state.projects.push(p); linkProject(p); delete state.ui.suggest[el.dataset.name.toLowerCase()]; save(); render(); break; }
      case 'project-dismiss': delete state.ui.suggest[el.dataset.name.toLowerCase()]; render(); break;
      case 'project-delete': if (confirm(t('deleteProject')+'?')) { state.projects = state.projects.filter(p => p.id !== id); for (const th of allThoughts()) if (th.projectId === id) th.projectId = null; save(); go('projects'); } break;
      case 'person-delete': if (confirm(t('forgetPerson')+'?')) { state.people = state.people.filter(p => p.id !== id); save(); go('people'); } break;
      case 'search-set': state.search = el.dataset.q; render(); break;
      case 'range': state.range = el.dataset.r; render(); break;
      case 'phrase-del': state.settings.endPhrases.splice(+el.dataset.i, 1); save(); render(); break;
      case 'phrase-add': { const inp = document.getElementById('phrase-new'); if (inp && inp.value.trim()) { state.settings.endPhrases.push(inp.value.trim()); save(); render(); } break; }
      case 'word-del': state.vocabulary.splice(+el.dataset.i, 1); save(); render(); break;
      case 'word-add': { const inp = document.getElementById('word-new'); if (inp && inp.value.trim()) { state.vocabulary.push(inp.value.trim()); save(); render(); } break; }
      case 'toggle-ai': state.settings.ai = !state.settings.ai; save(); render(); break;
      case 'delete-all': if (confirm(t('deleteAllQ'))) { state.sessions = []; state.projects = []; state.people = []; state.vocabulary = []; state.ui.suggest = {}; save(); go(''); render(); } break;
    }
  }
  function setType(th, ty){ th.type = ty; th.category = E.TYPE_CATEGORY[ty]; if (E.ACTION_TYPES.has(ty) && ty !== 'event') { th.actionability = 'required'; th.task = th.task || {title: E.actionTitle(th.cleanText), done:false}; } else if (ty !== 'event') { th.actionability = 'none'; delete th.task; } }
  function linkProject(p){ const names = [p.name, ...(p.aliases||[])].map(n => n.toLowerCase()); for (const th of allThoughts()) if (!th.projectId && names.some(n => E.normalize(th.originalText).includes(E.normalize(n)))) th.projectId = p.id; }
  function onChange(e){
    const el = e.target; if (el.dataset.field) { const th = findThought(el.dataset.id); if (!th) return; if (el.dataset.field === 'type') setType(th, el.value); else if (el.dataset.field === 'category') th.category = el.value; else if (el.dataset.field === 'project') th.projectId = el.value || null; th.reviewed = true; th.needsReview = false; save(); render(); }
    else if (el.dataset.set) { state.settings[el.dataset.set] = el.value; save(); render(); }
  }
  function onInput(e){ if (e.target.id === 'search-input') { state.search = e.target.value; render(); } }
  function onSubmit(e){ const f = e.target.closest && e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); if (f.dataset.form === 'write') onClick({target: f.querySelector('[data-act="write"]')}); }
  function onKey(e){ if (e.key !== 'Enter' && e.keyCode !== 13) return; if (e.target.id === 'write') return; const id = e.target.id; if (id === 'write') document.querySelector('[data-act="write"]')?.click(); else if (id === 'phrase-new') document.querySelector('[data-act="phrase-add"]')?.click(); else if (id === 'word-new') document.querySelector('[data-act="word-add"]')?.click(); else if (id === 'np-name' || id === 'np-desc' || id === 'np-alias') document.querySelector('[data-act="project-save"]')?.click(); }

  // ---------- Boot ----------
  function boot(){
    const had = load();
    if (!had || !state.sessions.length) { if (!had) seedExample(); }
    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('overlay').addEventListener('click', onClick);
    document.addEventListener('change', onChange); document.addEventListener('input', onInput); document.addEventListener('keydown', onKey); document.addEventListener('submit', onSubmit);
    window.addEventListener('hashchange', () => { state.ui.menuFor = null; render(); window.scrollTo(0,0); });
    render();
    (async () => { try { if (window.claude && window.claude.use) { [sampleFn, downloadsNs] = await Promise.all([window.claude.use('sample'), window.claude.use('downloads')]); } } catch {} if (route().p === 'settings' || route().p === 'session') render(); })();
  }
  return {boot, state};
})();
APP.boot();
</script>
